<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 1000px;
        }

        .login-container {
            max-width: 400px;
            padding: 50px 40px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        h2 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: normal;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-full {
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: white;
            margin: 0;
            font-size: 24px;
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .book-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .search-section {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-section input {
            flex: 1;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .book-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .book-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .book-card p {
            color: #666;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .book-card .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .book-card button {
            flex: 1;
            padding: 8px;
            font-size: 14px;
        }

        .btn-edit {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-delete {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
        }

        .success {
            color: #27ae60;
            font-size: 14px;
            margin-top: 10px;
        }

        .form-toggle {
            margin-bottom: 20px;
        }

        .form-toggle button {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="loginPage" class="page active">
        <div class="container login-container">
            <h1>Welcome Back</h1>
            <h2>Book Management System</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-full">Login</button>
                <div id="loginError" class="error"></div>
            </form>
            <p style="margin-top: 20px; color: #999; font-size: 14px;">
                Demo credentials: admin / password
            </p>
        </div>
    </div>

    <div id="dashboardPage" class="page">
        <div class="container">
            <div class="header">
                <h1>📚 Book Management System</h1>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
            <div class="content">
                <div class="book-form">
                    <h2 id="formTitle">Add New Book</h2>
                    <form id="bookForm">
                        <input type="hidden" id="bookId">
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input type="text" id="title" required>
                        </div>
                        <div class="form-group">
                            <label for="author">Author</label>
                            <input type="text" id="author" required>
                        </div>
                        <div class="form-group">
                            <label for="year">Year</label>
                            <input type="number" id="year" required>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" required></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" id="submitBtn">Add Book</button>
                            <button type="button" id="cancelBtn" onclick="cancelEdit()" style="display: none; background: #95a5a6;">Cancel</button>
                        </div>
                        <div id="formMessage"></div>
                    </form>
                </div>

                <div class="search-section">
                    <input type="text" id="searchInput" placeholder="Search by title or author...">
                    <button onclick="searchBooks()">Search</button>
                    <button onclick="loadAllBooks()" style="background: #95a5a6;">Show All</button>
                </div>

                <div id="booksContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // In-memory storage for books
        let books = [];
        let nextId = 1;
        let editingId = null;

        // Login functionality
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            if (username === 'admin' && password === 'password') {
                errorDiv.textContent = '';
                showDashboard();
            } else {
                errorDiv.textContent = 'Invalid username or password';
            }
        });

        function showDashboard() {
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('dashboardPage').classList.add('active');
            loadAllBooks();
        }

        function logout() {
            document.getElementById('dashboardPage').classList.remove('active');
            document.getElementById('loginPage').classList.add('active');
            document.getElementById('loginForm').reset();
            document.getElementById('loginError').textContent = '';
        }

        // Book CRUD operations
        document.getElementById('bookForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const book = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                year: parseInt(document.getElementById('year').value),
                description: document.getElementById('description').value
            };

            if (editingId !== null) {
                updateBook(editingId, book);
            } else {
                createBook(book);
            }
        });

        function createBook(book) {
            book.id = nextId++;
            books.push(book);
            showMessage('Book added successfully!', 'success');
            document.getElementById('bookForm').reset();
            loadAllBooks();
        }

        function readAllBooks() {
            return books;
        }

        function readBookById(id) {
            return books.find(book => book.id === id);
        }

        function updateBook(id, updatedBook) {
            const index = books.findIndex(book => book.id === id);
            if (index !== -1) {
                books[index] = { ...books[index], ...updatedBook };
                showMessage('Book updated successfully!', 'success');
                cancelEdit();
                loadAllBooks();
            }
        }

        function deleteBook(id) {
            if (confirm('Are you sure you want to delete this book?')) {
                books = books.filter(book => book.id !== id);
                showMessage('Book deleted successfully!', 'success');
                loadAllBooks();
            }
        }

        function loadAllBooks() {
            displayBooks(readAllBooks());
        }

        function searchBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = books.filter(book => 
                book.title.toLowerCase().includes(query) || 
                book.author.toLowerCase().includes(query)
            );
            displayBooks(filtered);
        }

        function displayBooks(booksToDisplay) {
            const container = document.getElementById('booksContainer');
            
            if (booksToDisplay.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No books found</h3>
                        <p>Start by adding your first book above</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="books-grid">
                    ${booksToDisplay.map(book => `
                        <div class="book-card">
                            <h3>${book.title}</h3>
                            <p><strong>Author:</strong> ${book.author}</p>
                            <p><strong>Year:</strong> ${book.year}</p>
                            <p><strong>Description:</strong> ${book.description}</p>
                            <p style="color: #999; font-size: 12px;">ID: ${book.id}</p>
                            <div class="actions">
                                <button class="btn-edit" onclick="editBook(${book.id})">Edit</button>
                                <button class="btn-delete" onclick="deleteBook(${book.id})">Delete</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function editBook(id) {
            const book = readBookById(id);
            if (book) {
                editingId = id;
                document.getElementById('bookId').value = id;
                document.getElementById('title').value = book.title;
                document.getElementById('author').value = book.author;
                document.getElementById('year').value = book.year;
                document.getElementById('description').value = book.description;
                document.getElementById('formTitle').textContent = 'Edit Book';
                document.getElementById('submitBtn').textContent = 'Update Book';
                document.getElementById('cancelBtn').style.display = 'inline-block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('bookForm').reset();
            document.getElementById('formTitle').textContent = 'Add New Book';
            document.getElementById('submitBtn').textContent = 'Add Book';
            document.getElementById('cancelBtn').style.display = 'none';
            showMessage('', '');
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('formMessage');
            messageDiv.textContent = message;
            messageDiv.className = type;
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = '';
            }, 3000);
        }

        // Add search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchBooks();
            }
        });
    </script>
</body>
</html>
