<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login / Register Page -->
    <div id="loginPage" class="page active">
        <div class="container login-container">
            <h1>Welcome</h1>
            <h2>Book Management System</h2>

            <!-- Toggle buttons -->
            <div class="form-toggle">
                <button id="showLoginBtn" class="toggle-active" onclick="showLoginForm()">Login</button>
                <button id="showRegisterBtn" onclick="showRegisterForm()">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-full">Login</button>
                <div id="loginError" class="error"></div>
            </form>

            <!-- Register Form (hidden by default) -->
            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required>
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" required>
                </div>
                <button type="submit" class="btn-full">Register</button>
                <div id="registerMessage"></div>
            </form>

            <p style="margin-top: 20px; color: #999; font-size: 14px;">
                Demo credentials: admin / password
            </p>
        </div>
    </div>

    <!-- Dashboard Page -->
    <div id="dashboardPage" class="page">
        <div class="container">
            <div class="header">
                <h1>Book Management System</h1>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
            <div class="content">

                <!-- Book Form -->
                <div class="book-form">
                    <h2 id="formTitle">Add New Book</h2>
                    <form id="bookForm">
                        <input type="hidden" id="bookId">
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input type="text" id="title" required>
                        </div>
                        <div class="form-group">
                            <label for="author">Author</label>
                            <input type="text" id="author" required>
                        </div>
                        <div class="form-group">
                            <label for="yearPublished">Year Published</label>
                            <input type="number" id="yearPublished" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" id="submitBtn">Add Book</button>
                            <button type="button" id="cancelBtn" class="btn-cancel" onclick="cancelEdit()" style="display: none;">Cancel</button>
                        </div>
                        <div id="formMessage"></div>
                    </form>
                </div>

                <!-- Search -->
                <div class="search-section">
                    <input type="text" id="searchInput" placeholder="Search by title, author, or year...">
                    <button onclick="searchBooks()">Search</button>
                    <button class="btn-cancel" onclick="clearSearch()">Show All</button>
                </div>

                <!-- Books Container -->
                <div id="booksContainer"></div>

                <!-- Pagination -->
                <div id="paginationControls"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
